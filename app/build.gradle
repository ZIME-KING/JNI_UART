plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.carserialdemo'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.carserialdemo"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('../carserial/native/CMakeLists.txt')
            version "4.1.2"
        }
    }

    sourceSets {
        main {
            java.srcDirs += ['../carserial/java/src/main/java']
        }
    }
}

tasks.register('copyCarserialHostToolDebug', Copy) {
    dependsOn 'externalNativeBuildDebug'
    from(fileTree(buildDir).matching { include '**/carserial_host_tool' })
    into file("${buildDir}/outputs/host-tool/debug")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}

